<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HGS Plays Portfolio — Internal Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="pin-locked">

  <div id="pin-gate">
    <div class="pin-card">
      <img class="pin-logo" src="assets/hgs-logo-white.svg" alt="HGS">
      <h1>Internal Navigator</h1>
      <p class="pin-sub">Enter the access PIN to view the HGS Plays Portfolio.</p>
      <form id="pin-form" autocomplete="off">
        <input id="pin-input" type="password" inputmode="text" placeholder="PIN" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="submit">Unlock</button>
        <div class="pin-error-msg" id="pin-error"></div>
      </form>
    </div>
  </div>

  <div id="app-root"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="pin.js"></script>
</body>
</html>
